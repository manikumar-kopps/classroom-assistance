{% extends "base.html" %}{% block content %}<h2>Speech-to-Text</h2><input id="a" type="file" accept="audio/*"><input id="l" value="en-US"><button onclick="go()">Transcribe</button><pre id="o"></pre><script>async function go(){let f=new FormData();f.append('audio',a.files[0]);f.append('language',l.value);o.textContent="Loading...";let r=await fetch('/api/speech',{method:'POST',body:f});let j=await r.json();o.textContent=j.result?JSON.stringify(j.result,null,2):j.error}</script>{% endblock %}
