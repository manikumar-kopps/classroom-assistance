{% extends "base.html" %}{% block content %}<h2>Vision</h2><input id="i" type="file" accept="image/*"><textarea id="p" rows="3">Describe this image in detail. Identify objects and readable text.</textarea><button onclick="go()">Analyze Image</button><pre id="o"></pre><script>async function go(){let f=new FormData();f.append('image',i.files[0]);f.append('prompt',p.value);o.textContent="Loading...";let r=await fetch('/api/vision',{method:'POST',body:f});let j=await r.json();o.textContent=j.result||j.error}</script>{% endblock %}
