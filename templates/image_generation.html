{% extends "base.html" %}{% block content %}<h2>Image Generation</h2><textarea id="p" rows="4" placeholder="A futuristic classroom..."></textarea><button onclick="go()">Generate</button><pre id="o"></pre><img id="im" style="max-width:100%;margin-top:15px"><script>async function go(){let r=await fetch('/api/image-generation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p.value})});let j=await r.json();o.textContent=j.error||'';if(j.url)im.src=j.url}</script>{% endblock %}
