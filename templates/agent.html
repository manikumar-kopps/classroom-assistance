{% extends "base.html" %}{% block content %}<h2>Foundry Agent Demo</h2><p>This lightweight app demonstrates agent-style instructions using your deployed model.</p><textarea id="p" rows="5">Explain supervised learning.</textarea><button onclick="go()">Ask Agent</button><pre id="o"></pre><script>async function go(){let r=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:p.value})});let j=await r.json();o.textContent=j.reply||j.error}</script>{% endblock %}
