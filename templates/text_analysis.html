{% extends "base.html" %}{% block content %}<h2>Text Analysis</h2><textarea id="t" rows="10" placeholder="Paste text"></textarea><button onclick="go()">Analyze</button><pre id="o"></pre><script>async function go(){let r=await fetch('/api/text-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});let j=await r.json();o.textContent=j.result||j.error}</script>{% endblock %}
