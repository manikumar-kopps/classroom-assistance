{% extends "base.html" %}{% block content %}<h2>Text Chat</h2><textarea id="p" rows="5" placeholder="Ask something"></textarea><button onclick="go()">Send</button><pre id="o"></pre><script>async function go(){o.textContent="Loading...";let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:p.value})});let j=await r.json();o.textContent=j.reply||j.error}</script>{% endblock %}
