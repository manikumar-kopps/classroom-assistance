{% extends "base.html" %}{% block content %}<h2>Content Understanding</h2><p>Upload a document, image, audio or video file and choose an analyzer supported by your resource.</p><input id="f" type="file"><input id="a" value="prebuilt-documentSearch" placeholder="Analyzer name"><button onclick="go()">Analyze</button><pre id="o"></pre><script>async function go(){let x=new FormData();x.append('file',f.files[0]);x.append('analyzer',a.value);o.textContent="Loading...";let r=await fetch('/api/content-understanding',{method:'POST',body:x});let j=await r.json();o.textContent=j.result?JSON.stringify(j.result,null,2):j.error}</script>{% endblock %}
